<div class="signin">
    <div class="hader">
    </div>
    <form (ngSubmit)="onSubmit()" #signupForm="ngForm">
        <CustomInput
            label="Email Address"
            type="text"
            placeholder="Enter your name"
            [(ngModel)]="emailAddress"
            name="emailAddress"
        />
        <CustomInput
            label="Password"
            type="text"
            placeholder="Enter your name"
            [(ngModel)]="password"
            name="password"
        />
        <button type="submit" >
            <span class="signin-content">Sign In </span>
        </button>
    </form>    
</div>
