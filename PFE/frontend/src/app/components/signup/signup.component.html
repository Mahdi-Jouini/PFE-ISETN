<div class="stepper">
  <form (ngSubmit)="onSubmit()" #signupForm="ngForm">
    <div class="signup-form">
      <div class="step" [ngClass]="{'active': currentStep === 0}">
        <div class="form-row">
          <div class="form-col">
            <CustomInput
              label="First name"
              type="text"
              placeholder="Enter your first name"
              [(ngModel)]="firstName"
              name="firstName"
              [validate]="true"
              validationType="name"
            />
          </div>
          <div class="form-col">
            <CustomInput
              label="Last name"
              type="text"
              placeholder="Enter your Last name"
              [(ngModel)]="lastName"
              name="lastName"
              [validate]="true"
              validationType="name"
            />
          </div>
        </div>
        <CustomInput
          label="Email Address"
          type="text"
          placeholder="Enter your email address"
          [(ngModel)]="emailAddress"
          name="emailAddress"
          [validate]="true"
          validationType="email"
        />
        <CustomInput 
          label="Profile Image" 
          type="file" 
          name="profileImage"
          [ngModel]="profileImage"
          (ngModelChange)="onFileChange($event)">
        </CustomInput>
        <CustomInput
          label="Password"
          type="password"
          placeholder="Enter your password"
          [(ngModel)]="password"
          [validate]="true"
          validationType="password"
        />
        <CustomInput
          label="Confirm Password"
          type="password"
          placeholder="Confirm your password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
        />
        <button type="button" class="next-button" (click)="nextStep()">
          Next Step
          <div class="arrow-wrapper">
            <div class="arrow"></div>
          </div>
        </button>
      </div>
      
      <div class="step" [ngClass]="{'active': currentStep === 1}">
        <app-otp 
        [otpLength]="5" 
        [allowAlphanumeric]="true"
        [title]="'Verify Account'" 
        [subtitle]="'Enter the verification code sent to ' + emailAddress"
        (otpComplete)="onOtpComplete($event)"
        (otpChange)="onOtpChange($event)">
      </app-otp>
        <div class="buttons-group">
          
          <button type="submit">
            Sign up
            <div class="arrow-wrapper">
              <div class="arrow"></div>
            </div>
            
          </button>
          
          <a (click)="previousStep()"> Back </a>
        </div>
      </div>
    </div>
  </form>
</div>
